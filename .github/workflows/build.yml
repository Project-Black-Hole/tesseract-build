# Builds the Tesseract library from the sources sources.pin.json names, on
# GitHub's own runners, and publishes it as a release when a tag is pushed.
# Nothing here is secret and nothing is downloaded that is not checked
# against a SHA-256 in sources.pin.json first.
name: Build

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runner: windows-2022
            python: python
          - platform: linux-x64
            runner: ubuntu-22.04
            python: python3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Tools
        shell: bash
        run: |
          cmake --version
          ${{ matrix.python }} --version
      - name: Build, check and package
        shell: bash
        run: ${{ matrix.python }} build.py build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tesseract-${{ matrix.platform }}
          path: dist/tesseract-${{ matrix.platform }}.tgz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd out
          sha256sum tesseract-*.tgz > SHA256SUMS
          cat SHA256SUMS
          cp ../sources.pin.json .
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "Built by this repository's workflow from the sources in sources.pin.json (commit $GITHUB_SHA)." \
            tesseract-win-x64.tgz tesseract-linux-x64.tgz SHA256SUMS sources.pin.json
